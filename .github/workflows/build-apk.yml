
name: Construir GeoVisor Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          unzip -q GeoVisorPro_Android_0.1_construccion_nube.zip -d extracted

      - name: Compilar APK
        working-directory: extracted/GeoVisorPro
        run: gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoVisorPro-APK
          path: extracted/GeoVisorPro/app/build/outputs/apk/debug/app-debug.apk
